name: "Build pull-request to main branch"

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  Build:
    name: Build Snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get remove --purge man-db
          sudo apt-get update
          sudo apt-get install --yes build-essential linux-headers-$(uname -r) libi2c-dev
          # Kernels 7.0+ ship spidev/i2c-dev in linux-modules, older ones need the extra package
          if apt-cache show linux-modules-extra-$(uname -r) >/dev/null 2>&1; then
            sudo apt-get install --yes linux-modules-extra-$(uname -r)
          fi

      - name: Install JDK25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Create and add current user to suitable groups
        run: |
          sudo addgroup spi
          sudo adduser $USER spi
          sudo adduser $USER i2c
          sudo adduser $USER dialout

      - name: Add proper udev rules and trigger udevadm
        run: |
          sudo cp udev.rules /etc/udev/rules.d/99-pi4j-io.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger

      - name: Cache local Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build entire Pi4J Project
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        run: sudo -u $USER env JAVA_HOME="$JAVA_HOME" ./mvnw clean package

      - name: Make staging directory
        run: mkdir staging

      - name: Upload distribution files to staging
        uses: actions/upload-artifact@v7
        with:
          name: pi4j-dist
          path: staging
